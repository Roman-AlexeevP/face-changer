name: face-changer

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-facechanger}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://user:pass@postgres:5432/facechanger}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media_data:/data/tmp
    command: ["python", "-m", "app.main_bot"]

  # Одноразовая джоба: применяет миграции и завершается.
  # Запуск: docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://user:pass@postgres:5432/facechanger}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  worker:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://user:pass@postgres:5432/facechanger}
    depends_on:
      postgres:
        condition: service_healthy
      bot:
        condition: service_started
    volumes:
      - media_data:/data/tmp
    stop_grace_period: 30s
    command: ["python", "-m", "app.main_worker"]

  # Отдельная база под тесты: tmpfs, чтобы не писать на диск и стартовать быстро.
  postgres-test:
    profiles: ["test"]
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: facechanger_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d facechanger_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      ENGINE: mock
      PAYMENT_PROVIDER: stub
      PYTHONHASHSEED: "0"
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://user:pass@postgres:5432/facechanger}
      TEST_DATABASE_URL: postgresql+asyncpg://user:pass@postgres-test:5432/facechanger_test
    depends_on:
      postgres-test:
        condition: service_healthy
    volumes:
      - ./reports:/app/reports
      - ./app:/app/app
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
    command:
      - pytest
      - -q
      - -n
      - auto
      - --cov=app
      - --cov-report=term-missing
      - --cov-report=html:reports/coverage
      - --html=reports/report.html
      - --self-contained-html

volumes:
  postgres_data:
  media_data:
