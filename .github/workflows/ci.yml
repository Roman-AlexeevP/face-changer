name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  tests:
    name: Docker tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests with PostgreSQL
        run: docker compose --profile test run --build --rm -T tests

      - name: Remove test containers and volumes
        if: always()
        run: docker compose --profile test down --volumes --remove-orphans
